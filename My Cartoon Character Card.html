<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cartoon Character Card</title>

  <style>

    /* Universal Selector - applies to everything on the page */
    * {
      font-size: 16px;
    }

    /* Element Selectors */
    body {
      background-color: lightyellow;
    }

    h1 {
      color: darkblue;
    }

    h2 {
      color: purple;
    }

    p {
      color: dimgray;
    }

    /* Class Selector */
    .cartoon-detail {
      color: darkgreen;
      font-weight: bold;
    }

    /* ID Selector */
    #cartoon-card {
      background-color: lightcyan;
    }

  </style>

</head>
<body>

  <h1>My Cartoon Character Card</h1>

  <!-- Inline CSS -->
  <p style="color: crimson;">Meet my favourite cartoon character!</p>

  <div id="cartoon-card">

    <h2>About My Character</h2>

    <p class="cartoon-detail">Character Name:Spider-Man</p>
    <p class="cartoon-detail">Best Friend:nid</p>
    <p class="cartoon-detail">Favourite Food:homemade wheatcakes</p>
    <p class="cartoon-detail">Special Power: spider sense and web shooters</p>

  </div>

  <h2>Why I Like This Character</h2>

  <p><b> He is cool </b></p>
  <p><b>He is a Genius</b></p>
  <p><b>He Never Gives Up</b></p>

</body>
</html>
