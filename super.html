<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>my superhero card</title>
    <style>
        body{
            background-color: rgb(224, 224, 224);
            color:rgb(34, 255, 0);
            font-family:fantasy;
        }
        h1,h2,p{
            text-align:center;
        }
        h1{
            color:rgb(241, 0, 0);
            text-shadow:3px 3px rgb(0, 255, 238);
            text-transform: uppercase;
        }
        .attributes{
            color:greenyellow;
            text-decoration:underline;
            text-transform: capitalize;
        }
        .power{
            color: rgb(0, 0, 0);
            font-weight:bold;
            text-transform: uppercase;
        }
        .failure{
            color:rgb(255, 0, 0);
            text-transform: uppercase;
            text-shadow: 2px 2px black;
        }
        .weakness{
            color:rgb(255, 255, 0);
            text-decoration: line-through;
            text-transform: uppercase;
        }
        .badge{
            color: aqua;
            font-size: 30px;
            transform: rotate(-4deg);
            text-transform: uppercase;
        }
        .footer{
            color: black;
            text-shadow:1px 1px white;
        }
    </style>
</head>
<body>
    <h1>Thunder kid</h1>
    <p>greatest teenage superhero in the city!</p>

    <h2 class="attributes">his super strenghts</h2>
    <p class="power">his can generate electricity</p>

    <h2 class="failure">his weakness</h2>
    <p class="weakness">wind</p>

    <p class="badge">TOP HERO</p>
    <p class="footer">created by DHAIWIK</p>
</body>
</html>
