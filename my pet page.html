<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>My Pet Page</title>
    <style>
        body{
            background-color: antiquewhite;
            font-family: Arial, Helvetica, sans-serif;
        }
        .top{
            position:fixed;
            top:0;
            background-color:rgb(255, 255, 0);
            color: rgb(167, 8, 236);
        }
        .note{
            position: relative;
            left: 30px;
        }
        .card{
            position: relative;
            padding: 20px;
            background-color: rgb(0, 255, 229);
        }
        .badge{
            position:absolute;
            right: 0;
            top:0;
            background-color: rgb(190, 231, 8);
            color: rgb(9, 9, 9);
        }
        .sticky{
            position: sticky;
            top: 20px;
            background-color: rgb(255, 145, 0);
            color: rgb(255, 0, 0);
        }
     </style>
</head>
<body>
    <div class="top">🐶buddy</div><br><br>
    <h1>Buddy the labrador</h1>
    <h3>static</h3>
    <p>Age:2 years</p>
    <h3>Relative</h3>
    <p class="note">pet of the month!</p>
    <h3>absolute</h3>
    <div class="card">buddy<span class="badge">adopted</span></div>
    <h3>sticky</h3>
    <div class="sticky">more pets</div>
    <p>luna<br>max<br>daisy<br>rocky<br>bella<br>coco</p>
    <br><br>
     <br><br>
      <br><br>
     <br><br>
      <br><br>
       <br><br>
        <br><br>
         <br><br>
          <br><br>
           <br><br>
    
</body>
</html>
