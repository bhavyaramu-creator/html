<!DOCTYPE html>
<html lang="en">
<head>
    <title>Doctors appointment</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Personal details</legend>
            <label>your name</label>
            <br>
            <input type="text" placeholder="enter your full name">
            <br><br>
             <label>patient ID</label>
            <br>
            <input type="password" placeholder="your patient ID">
            <br><br>
             <label>your DOB</label>
            <br>
            <input type="date">
            <br><br>
            <label>choose your doctor</label>
            <br>
            <select>
                <option>select a doctor</option>
                <option>doctor vasanth</option>
                <option>doctor naveen</option>
                </select>            
                <br>
                <label>reason for visiting</label>
                <br>
                <input type="radio" name="reason" value="fever">fever<br>
                 <input type="radio" name="reason" value="cough">cough<br>
                 <br>
                 <label>notes for doctor</label><br>
                 <textarea></textarea><br><br>
                 <label>select your visiting day</label><br>
                <input type="checkbox">monaday<br>
                 <input type="checkbox">wednesday<br>
                  <input type="checkbox">friday<br><br>
                  <input type="submit" value="book your day">
        </fieldset>
    </form>
</body>
</html>
