<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Methods in Javascript</title>
</head>
<body>
    <script>
        var srt="AmAzInG";
        document.write(srt.toUpperCase());
        document.write("<br>");
        document.write(srt.toLowerCase());
        document.write("<br>");
        document.write(srt.startsWith("B"));
    </script>
    
</body>
</html>
