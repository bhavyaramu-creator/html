<!DOCTYPE html>
<html>
<head>
  <title>My Animal Fact File</title>
  <style>
    body{
        background-color: white;
        font-family: Arial, Helvetica, sans-serif;
    }
    .fact-file{
        background-color: rgb(43, 113, 243);
        color: rgb(122, 111, 111);
        width: 260px;
        padding: 25px;
        border: 4px solid rgb(255, 0, 0);
        margin: 30px;
    }
    .animal-name{
        color: rgb(0, 237, 190);
        font-size: 22px;
    }
    .detail{
        color: rgb(0, 0, 0);
    }
    .cool-fact{
        color: rgb(247, 231, 6);
        font-style: italic;
    }
  </style>
</head>
<body>

  <div class="fact-file">
    <h2 class="animal-name">Snow Leopard</h2>
    <p class="detail">Type: Big Cat</p>
    <p class="detail">Lives in: Mountain ranges of Central Asia</p>
    <p class="detail">Diet: Deer, goats, and wild sheep</p>
    <p class="cool-fact">Cool Fact: Can leap up to 15 metres in one jump!</p>
  </div>

</body>
</html>
